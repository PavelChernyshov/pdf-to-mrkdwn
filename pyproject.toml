[project]
name = "pdf-to-mrkdwn"
version = "0.1.0"
description = "Convert PDFs to Markdown page-by-page with a local vision model (WeVisDoc) served by LM Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pymupdf>=1.24",
]

[project.scripts]
pdf2md = "pdf_to_mrkdwn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_mrkdwn"]
